
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>Yoru Music</title>

<style>
:root {
  --bg: #101014;
  --panel: #1b1a22;
  --text: #f5f2fa;
  --muted: #9994a6;
  --purple: #bd9cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  padding: 24px 18px 115px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.logo { font-size: 25px; font-weight: 800; letter-spacing: 2px; }
.logo span { color: var(--purple); }
.tag { color: var(--muted); font-size: 12px; }
h2 { font-size: 21px; margin: 8px 0; }
p { color: var(--muted); }
button { font: inherit; cursor: pointer; }
.add {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 15px;
  background: var(--purple);
  color: #171020;
  font-weight: 750;
  margin: 15px 0 25px;
}
.section {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.count { color: var(--muted); font-size: 12px; }
.song {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 11px 0;
  cursor: pointer;
  border-bottom: 1px solid #25232c;
}
.cover {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border-radius: 10px;
  background: linear-gradient(140deg,#51416f,#201d30 60%,#a47dd7);
  display: grid;
  place-items: center;
  font-size: 22px;
  overflow: hidden;
}
.cover img { width:100%;height:100%;object-fit:cover; }
.song-info { flex: 1; min-width: 0; }
.song-info strong, .song-info small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.song-info strong { font-size: 14px; }
.song-info small { color: var(--muted); margin-top: 4px; }
.song.active strong { color: var(--purple); }
.play-now { color: var(--purple); padding: 8px; }
.empty {
  text-align: center;
  padding: 30px 12px;
  border: 1px dashed #393442;
  border-radius: 16px;
  margin-top: 16px;
}
.empty .symbol { font-size: 35px; }
.player {
  background: var(--panel);
  border: 1px solid #302b3a;
  border-radius: 22px;
  padding: 18px;
  margin-top: 32px;
}
.player-top {
  display: flex;
  align-items: center;
  gap: 14px;
}
.big-cover {
  width: 78px;
  height: 78px;
  flex-shrink: 0;
  border-radius: 14px;
  background: linear-gradient(140deg,#6b528f,#211b30,#c1a0ff);
  display: grid;
  place-items: center;
  font-size: 30px;
  overflow: hidden;
}
.big-cover img { width:100%;height:100%;object-fit:cover; }
.track { min-width:0;flex:1; }
.track strong,.track small {
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.track small { color:var(--muted);margin-top:6px; }
#seek { width:100%;accent-color:var(--purple);margin:20px 0 4px; }
.times { display:flex;justify-content:space-between;color:var(--muted);font-size:12px; }
.controls { display:flex;justify-content:center;align-items:center;gap:25px;margin-top:17px; }
.ctrl { border:0;background:transparent;color:var(--text);font-size:25px;padding:5px; }
.ctrl.main {
  background:var(--purple);color:#171020;
  width:58px;height:58px;border-radius:50%;font-size:24px;
}
footer {
  position:fixed;bottom:0;left:0;right:0;
  background:#15141b;
  border-top:1px solid #2c2934;
  padding:13px 10px calc(13px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;
}
footer button { background:none;border:0;color:var(--muted);font-size:12px; }
footer button span { display:block;font-size:20px;margin-bottom:3px; }
footer button.selected { color:var(--purple); }
audio { display:none; }
</style>
</head>

<body>
<header>
  <div>
    <div class="logo">YORU<span>♪</span></div>
    <div class="tag">TU MÚSICA, TU UNIVERSO</div>
  </div>
  <div style="font-size:24px">☾</div>
</header>

<section>
  <div class="tag">TU ESPACIO PERSONAL</div>
  <h2>Buenas noches.</h2>
  <p>Encuentra tu propio ritmo.</p>

  <button class="add" id="pick">＋ Añadir música del teléfono</button>
  <input id="files" type="file" accept="audio/*" multiple hidden>
</section>

<section id="library">
  <div class="section">
    <h2>Tu biblioteca</h2>
    <span class="count" id="count">0 canciones</span>
  </div>
  
<div style="margin:16px 0;display:flex;gap:8px">
  <input
    id="search"
    type="search"
    placeholder="Buscar canción o archivo..."
    style="flex:1;min-width:0;background:#1b1a22;color:#f5f2fa;border:1px solid #393442;border-radius:12px;padding:13px;font-size:14px"
  >
  <button id="filterFavorites"
    style="background:#292331;color:#bd9cff;border:0;border-radius:12px;padding:0 14px">
    ♡
  </button>
</div>

  <div id="songs">
    <div class="empty">
      <div class="symbol">♫</div>
      <strong>Tu música empieza aquí</strong>
      <p>Selecciona archivos de audio de tu teléfono para comenzar.</p>
    </div>
  </div>
</section>

<section class="player" id="player">
  <div class="tag" style="margin-bottom:14px">REPRODUCIENDO</div>
  <div class="player-top">
    <div class="big-cover" id="bigCover">♫</div>
    <div class="track">
      <strong id="title">Ninguna canción</strong>
      <small id="artist">Elige algo para escuchar</small>
    </div>
    <button class="ctrl" id="like" aria-label="Marcar favorito">♡</button>
  </div>

  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="times">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl" id="shuffle" aria-label="Aleatorio">⤨</button>
    <button class="ctrl" id="prev" aria-label="Anterior">◀|</button>
    <button class="ctrl main" id="toggle" aria-label="Reproducir">▶</button>
    <button class="ctrl" id="next" aria-label="Siguiente">|▶</button>
    <button class="ctrl" id="repeat" aria-label="Repetir">↻</button>
  </div>
  <p class="tag" id="status" style="text-align:center;margin-bottom:0">
    Listo para escuchar
  </p>
</section>

<audio id="audio" preload="metadata"></audio>

<footer>
  <button class="selected" id="homeTab"><span>⌂</span>Inicio</button>
  <button id="libraryTab"><span>♫</span>Biblioteca</button>
  <button id="playerTab"><span>◉</span>Reproductor</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");
let playlist = [];
let current = -1;
let shuffle = false;
let repeat = false;
let favorites = new Set();

function time(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ":" + String(s).padStart(2, "0");
}

$("pick").onclick = () => $("files").click();

$("files").onchange = event => {
  const files = Array.from(event.target.files || []);
  for (const file of files) {
    if (!file.type.startsWith("audio/")) continue;
    playlist.push({
      name: file.name.replace(/\.[^.]+$/, ""),
      artist: "Archivo local",
      url: URL.createObjectURL(file),
      file
    });
  }
  render();
  $("status").textContent = files.length
    ? "Archivos añadidos a tu biblioteca"
    : "No se seleccionaron archivos";
  event.target.value = "";
};


function render() {
  $("count").textContent = playlist.length +
    (playlist.length === 1 ? " canción" : " canciones");

  const query = $("search").value.toLowerCase().trim();
  const onlyFavorites = $("filterFavorites").dataset.active === "true";

  $("songs").replaceChildren();

  const visible = playlist
    .map((song, index) => ({ song, index }))
    .filter(({ song }) => song.name.toLowerCase().includes(query))
    .filter(({ song }) => !onlyFavorites || favorites.has(song));

  if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = playlist.length
      ? "No hay canciones que coincidan."
      : "Añade música para comenzar.";
    $("songs").append(empty);
    return;
  }

  visible.forEach(({ song, index }) => {
    const row = document.createElement("div");
    row.className = "song" + (index === current ? " active" : "");

    const cover = document.createElement("div");
    cover.className = "cover";
    cover.textContent = "♫";

    const info = document.createElement("div");
    info.className = "song-info";

    const name = document.createElement("strong");
    name.textContent = song.name;

    const artist = document.createElement("small");
    artist.textContent = song.artist;

    info.append(name, artist);

    const favorite = document.createElement("button");
    favorite.className = "play-now";
    favorite.style.background = "transparent";
    favorite.style.border = "0";
    favorite.textContent = favorites.has(song) ? "♥" : "♡";

    favorite.onclick = event => {
      event.stopPropagation();

      if (favorites.has(song)) favorites.delete(song);
      else favorites.add(song);

      if (current >= 0) {
        $("like").textContent =
          favorites.has(playlist[current]) ? "♥" : "♡";
      }

      render();
    };

    row.append(cover, info, favorite);
    row.onclick = () => playSong(index);
    $("songs").append(row);
  });
}

$("search").addEventListener("input", render);

$("filterFavorites").onclick = () => {
  const button = $("filterFavorites");
  const active = button.dataset.active !== "true";

  button.dataset.active = String(active);
  button.textContent = active ? "♥" : "♡";
  button.style.background = active ? "#49365f" : "#292331";

  render();
};


async function playSong(index) {
  if (!playlist.length) {
    $("status").textContent = "Primero añade música";
    return;
  }

  current = (index + playlist.length) % playlist.length;
  const song = playlist[current];

  audio.src = song.url;
  $("title").textContent = song.name;
  $("artist").textContent = song.artist;
  $("bigCover").textContent = "♫";
  $("like").textContent = favorites.has(song) ? "♥" : "♡";
  $("status").textContent = "Cargando canción…";
  render();

  try {
    await audio.play();
    $("status").textContent = "Reproduciendo ahora";
  } catch (error) {
    $("status").textContent =
      "Pulsa reproducir para intentar de nuevo";
  }

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name,
      artist: song.artist,
      album: "Yoru Music"
    });
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", nextSong);
    navigator.mediaSession.setActionHandler("previoustrack", prevSong);
  }
}

function nextSong() {
  if (!playlist.length) return;
  let index = current + 1;
  if (shuffle && playlist.length > 1) {
    do {
      index = Math.floor(Math.random() * playlist.length);
    } while (index === current);
  }
  playSong(index);
}

function prevSong() {
  if (!playlist.length) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    playSong(current - 1);
  }
}

$("toggle").onclick = async () => {
  if (current === -1) {
    if (playlist.length) await playSong(0);
    else $("files").click();
  } else if (audio.paused) {
    try {
      await audio.play();
    } catch (e) {
      $("status").textContent = "No se pudo iniciar la reproducción";
    }
  } else {
    audio.pause();
  }
};

$("next").onclick = nextSong;
$("prev").onclick = prevSong;

$("shuffle").onclick = () => {
  shuffle = !shuffle;
  $("shuffle").style.color = shuffle ? "var(--purple)" : "var(--text)";
  $("status").textContent = shuffle ? "Modo aleatorio activado" : "Modo aleatorio desactivado";
};

$("repeat").onclick = () => {
  repeat = !repeat;
  audio.loop = repeat;
  $("repeat").style.color = repeat ? "var(--purple)" : "var(--text)";
  $("status").textContent = repeat ? "Repetición activada" : "Repetición desactivada";
};

$("like").onclick = () => {
  if (current < 0) return;

  const song = playlist[current];

  if (favorites.has(song)) favorites.delete(song);
  else favorites.add(song);

  $("like").textContent = favorites.has(song) ? "♥" : "♡";
  render();
};
audio.onplay = () => {
  $("toggle").textContent = "Ⅱ";
  $("status").textContent = "Reproduciendo ahora";
  render();
};

audio.onpause = () => {
  $("toggle").textContent = "▶";
  render();
};

audio.onloadedmetadata = () => {
  $("duration").textContent = time(audio.duration);
};

audio.ontimeupdate = () => {
  $("currentTime").textContent = time(audio.currentTime);
  $("duration").textContent = time(audio.duration);
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    $("seek").value = audio.currentTime / audio.duration * 1000;
  }
};

$("seek").oninput = () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = Number($("seek").value) / 1000 * audio.duration;
  }
};

audio.onended = () => {
  if (!repeat) nextSong();
};

audio.onerror = () => {
  $("status").textContent = "No se pudo leer este archivo de audio";
};

$("homeTab").onclick = () => window.scrollTo({top: 0, behavior: "smooth"});
$("libraryTab").onclick = () =>
  $("library").scrollIntoView({behavior: "smooth"});
$("playerTab").onclick = () =>
  $("player").scrollIntoView({behavior: "smooth"});
</script>
</body>
</html>
